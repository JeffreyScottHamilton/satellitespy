<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satellitespy</title>
  <meta name="description" content="An interactive 3D globe of public live data: aircraft, ships, satellites, earthquakes and more." />
  <!-- Raster fallbacks: Safari ignores an SVG apple-touch-icon and falls back to a
       screenshot of the page, so an installed app needs a real PNG. Regenerate
       these from the logo with `node scripts/generate-icons.mjs`. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <!-- Listed after the PNG: browsers that use the last usable icon keep the SVG
       for the tab. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#141414" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Satellitespy" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=add,adjust,ads_click,air,airline_seat_recline_normal,align_horizontal_left,align_horizontal_right,anchor,arrow_drop_down,arrow_forward,arrow_left,arrow_right,auto_awesome,block,bolt,bug_report,cable,category,change_history,chevron_left,chevron_right,close,close_fullscreen,cloud,contrast,cyclone,dark_mode,dataset,delete,diamond,directions_boat,directions_bus,directions_car,directions_walk,dns,downhill_skiing,draw,earthquake,east,eco,egg_alt,emergency_home,factory,filter_list,flag,flare,flight,foggy,grid_on,grid_view,handyman,history,home,hourglass_empty,image,label,landscape,layers,layers_clear,light_mode,local_fire_department,location_city,location_off,location_on,more_horiz,movie,my_location,navigation,newspaper,normal,on,open_in_full,palette,partly_cloudy_day,pause,pedal_bike,pentagon,pest_control,pets,photo_camera,play_arrow,public,question_mark,radar,radio,radio_button_checked,radio_button_unchecked,rainy,raven,remove,restart_alt,right_panel_close,right_panel_open,rocket_launch,satellite_alt,schedule,search,sensors,set_meal,settings,shield,skip_next,skip_previous,star,streetview,sunny,thermostat,thunderstorm,timeline,traffic,train,travel_explore,tune,umbrella,upload_file,videocam,view_in_ar,visibility,visibility_off,warning,water,water_drop,waves,weather_snowy,zoom_in_map" rel="stylesheet" />
</head>
<body>
  <div class="gev-view" data-gev-view="scene-chrome"></div>
  <div class="gev-view" data-gev-view="cockpit"></div>
  <div class="gev-view" data-gev-view="display-controls"></div>
  <div class="gev-view" data-gev-view="command-dock"></div>
  <div class="gev-view" data-gev-view="layer-panels"></div>
  <div class="gev-view" data-gev-view="context"></div>
  <div class="gev-view" data-gev-view="welcome"></div>
  <div class="gev-view" data-gev-view="provider-settings"></div>
  <div class="gev-view" data-gev-view="top-actions"></div>
  <!-- Intelligence HUD Overlay -->
  <div class="gev-view" data-gev-view="intel-hud"></div>
  <div id="gev-stories-host" class="gev-view" data-gev-view="stories"></div>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <svg class="loader-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <g transform="rotate(-25 16 16)" fill="none" stroke="#e6edf3" stroke-width="1.75">
          <ellipse cx="16" cy="16" rx="13" ry="5" />
        </g>
        <circle cx="16" cy="16" r="5" fill="#e6edf3" />
        <circle class="loader-satellite" cx="27.78" cy="10.51" r="2" fill="#EF6A40" />
      </svg>
      <p class="loader-status" data-i18n>Initializing photorealistic world...</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
